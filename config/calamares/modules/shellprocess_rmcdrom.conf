---
dontChroot: true
timeout: 60
script:
    - command: "if [ -f \"${ROOT}/etc/apt/sources.list.d/cdrom.sources\" ]; then rm -f \"${ROOT}/etc/apt/sources.list.d/cdrom.sources\"; fi"
    - command: "if [ -f \"${ROOT}/etc/apt/sources.list.d/cdrom.list\" ]; then rm -f \"${ROOT}/etc/apt/sources.list.d/cdrom.list\"; fi"
    - command: "for list_file in \"${ROOT}/etc/apt/sources.list\" \"${ROOT}\"/etc/apt/sources.list.d/*.list; do [ -f \"$list_file\" ] || continue; sed -i '/^[[:space:]]*deb[[:space:]].*cdrom:/Id;/^[[:space:]]*deb-src[[:space:]].*cdrom:/Id' \"$list_file\"; done"
    - command: "for src_file in \"${ROOT}\"/etc/apt/sources.list.d/*.sources; do [ -f \"$src_file\" ] || continue; if grep -qi 'cdrom:' \"$src_file\"; then awk 'BEGIN { drop=0 } /^[[:space:]]*$/ { if (!drop) print; drop=0; next } { line=tolower($0); if (line ~ /^uris:[[:space:]]*cdrom:/) { drop=1; next } if (!drop) print }' \"$src_file\" > \"${src_file}.tmp\" && mv \"${src_file}.tmp\" \"$src_file\"; fi; done"
    - command: "if mountpoint -q \"${ROOT}/cdrom\"; then umount \"${ROOT}/cdrom\" || true; fi"
    - command: "if [ -d \"${ROOT}/cdrom\" ]; then rmdir \"${ROOT}/cdrom\" 2>/dev/null || true; fi"
